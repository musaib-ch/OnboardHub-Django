name: Security and Django checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-not-for-production-please-replace
      APP_ENV: production
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt bandit pip-audit
      - run: python -m compileall -q core onboardhub
      - run: python manage.py check --deploy
      - run: python manage.py test
      - run: pip-audit -r requirements.txt
      - run: bandit -r core onboardhub -ll -x core/migrations
