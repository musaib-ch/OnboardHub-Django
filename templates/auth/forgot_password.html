{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block auth_content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="glass-card p-4 mt-5 animate-fadeIn">
            <h4 class="mb-1"><i class="bi bi-key me-2"></i>Forgot Password</h4>
            <p class="text-muted">Enter your email and we'll send you a reset link.</p>
            <form method="POST">
                {% csrf_token %}
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control mb-3" required placeholder="you@company.com">
                <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
            </form>
            <div class="text-center mt-3"><a href="{% url 'login' %}" class="text-decoration-none small">Back to sign in</a></div>
        </div>
    </div>
</div>
{% endblock %}
