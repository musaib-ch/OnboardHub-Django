{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="glass-card p-4 mt-4 animate-fadeIn">
            <h4 class="mb-1"><i class="bi bi-shield-lock me-2"></i>Set Your Password</h4>
            <p class="text-muted">For your security, please set a new password to continue.</p>
            <form method="POST">
                {% csrf_token %}
                <label class="form-label">New Password</label>
                <input type="password" name="password" class="form-control mb-3" required minlength="8">
                <label class="form-label">Confirm Password</label>
                <input type="password" name="confirm_password" class="form-control mb-3" required minlength="8">
                <button type="submit" class="btn btn-primary w-100">Update Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
