{% extends "base.html" %}
{% block title %}Edit {{ template.name }}{% endblock %}
{% block content %}
<div class="page-header animate-fadeIn">
    <div class="d-flex align-items-center">
        <a href="{% url 'admin_templates_list' %}" class="btn btn-outline-secondary me-3"><i class="bi bi-arrow-left"></i></a>
        <div>
            <h1 class="mb-0"><i class="bi bi-pencil-square me-2"></i>Edit Template</h1>
            <p class="text-muted mb-0">{{ template.name }}</p>
        </div>
    </div>
</div>

<form method="POST" class="glass-card p-4 animate-fadeIn">
    {% csrf_token %}
    <div class="row g-3 mb-4">
        <div class="col-md-6">
            <label class="form-label fw-medium">Template Name <span class="text-danger">*</span></label>
            <input type="text" name="name" class="form-control" value="{{ template.name }}" required>
        </div>
        <div class="col-md-6">
            <label class="form-label fw-medium">Description</label>
            <input type="text" name="description" class="form-control" value="{{ template.description }}">
        </div>

        <div class="col-12">
            <label class="form-label fw-medium">Select Stages <span class="text-danger">*</span></label>
            <select name="stages" class="form-select" multiple size="6" required>
                {% for option in stage_options %}
                <option value="{{ option.key }}" {% if option.key in template.stages %}selected{% endif %}>
                    {{ option.label }} ({{ option.key }})
                </option>
                {% empty %}
                <option value="" disabled>No code-defined stages available</option>
                {% endfor %}
            </select>
            <small class="text-muted mt-2 d-block">Hold Ctrl or Cmd to choose more than one stage.</small>
        </div>
    </div>

    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">
            <i class="bi bi-check-lg me-1"></i>Save Changes
        </button>
        <a href="{% url 'admin_templates_list' %}" class="btn btn-outline-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
