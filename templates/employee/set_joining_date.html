{% extends "base.html" %}
{% block title %}Set Joining Date{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="glass-card p-4 mt-4 animate-fadeIn">
            <h4 class="mb-1"><i class="bi bi-calendar-check me-2"></i>Welcome!</h4>
            <p class="text-muted">Please confirm your date of joining to begin onboarding.</p>
            <form method="POST">
                {% csrf_token %}
                <label class="form-label">Date of Joining <span class="text-danger">*</span></label>
                <input type="date" name="date_of_joining" class="form-control mb-3" required>
                <button type="submit" class="btn btn-primary w-100">Continue <i class="bi bi-arrow-right ms-1"></i></button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
